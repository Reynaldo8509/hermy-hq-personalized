name: Public secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-added-lines:
    name: Scan added lines for hardcoded credentials
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Fetch comparison commit and scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$BASE_SHA" != "$HEAD_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          python3 scripts/check-public-secrets.py "$BASE_SHA" "$HEAD_SHA"
      - name: Test MCP restart request contract
        run: node --test src/lib/mcp-restart-approval.test.mjs src/lib/mcp-restart-service-auth.test.mjs

  mcp-route-build:
    name: Build and exercise MCP dynamic route in isolation
    needs: scan-added-lines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hermyhq_contract_mcp_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermyhq_contract_mcp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres@localhost:55439/hermyhq_contract_mcp_ci?schema=public
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install the committed dependency lockfile
        run: npm ci --no-audit --no-fund
      - name: Create isolated schema
        run: npx prisma migrate deploy
      - name: Build HQ without production credentials
        run: npm run build
      - name: Verify the emitted dynamic route
        run: node scripts/verify-mcp-restart-route-build.mjs
      - name: Create a temporary synthetic service credential
        run: |
          credential_dir="$(mktemp -d /tmp/hq-mcp-restart-test-XXXXXX)"
          chmod 700 "$credential_dir"
          python3 -c 'import secrets, sys; sys.stdout.write(secrets.token_urlsafe(32))' > "$credential_dir/mcp-restart-request-token"
          chmod 600 "$credential_dir/mcp-restart-request-token"
          echo "CREDENTIALS_DIRECTORY=$credential_dir" >> "$GITHUB_ENV"
      - name: Exercise the local production build against isolated PostgreSQL
        run: |
          set -euo pipefail
          ./node_modules/.bin/next start --hostname localhost --port 3216 >/tmp/hermy-hq-mcp-test.log 2>&1 &
          app_pid="$!"
          trap 'kill "$app_pid" 2>/dev/null || true; rm -rf "${CREDENTIALS_DIRECTORY:?}" /tmp/hermy-hq-mcp-test.log' EXIT
          last_status="000"
          for attempt in $(seq 1 60); do
            last_status="$(curl --max-time 2 -sS -o /dev/null -w '%{http_code}' http://localhost:3216/api/mcp/restart-requests 2>/dev/null || true)"
            if [ "$last_status" = "401" ]; then
              node scripts/test-mcp-restart-request-runtime.mjs
              exit 0
            fi
            if [ -n "$last_status" ] && [ "$last_status" != "000" ]; then
              echo "MCP test server returned unexpected HTTP status: $last_status" >&2
              exit 1
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "MCP test server exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done
          echo "MCP local server readiness timed out; last HTTP status: $last_status" >&2
          exit 1
        env:
          MCP_RESTART_TEST_MODE: "1"
          MCP_RESTART_TEST_URL: http://localhost:3216
